<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<style>
  :root {
    --base:#1e1e2e; --mantle:#181825; --crust:#11111b;
    --surface0:#313244; --surface1:#45475a; --surface2:#585b70;
    --text:#cdd6f4; --subtext:#a6adc8; --overlay:#6c7086;
    --akzent:#89b4fa;
    --lauf:#94e2d5; --denkt:#cba6f7; --werkzeug:#f9e2af;
    --wartet:#fab387; --fehler:#f38ba8; --fertig:#a6e3a1;
    --mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
    --sans:Inter,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--base);color:var(--text);font:14px/1.5 var(--sans);height:100vh;overflow:hidden}
  #app{display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:44px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;overflow:hidden;
    background:var(--mantle);border-bottom:1px solid var(--surface0)}
  header h1{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--subtext);margin:0;flex:0 0 auto}
  header select{max-width:230px;flex:0 1 auto}
  header button{flex:0 0 auto;white-space:nowrap}
  .pill{font:11px/1 var(--mono);padding:5px 9px;border-radius:999px;background:var(--surface0);
    color:var(--subtext);white-space:nowrap;flex:0 0 auto}
  .pill.an{background:color-mix(in srgb,var(--lauf) 22%,transparent);color:var(--lauf)}
  .pill.ab{background:color-mix(in srgb,var(--fehler) 22%,transparent);color:var(--fehler)}
  .spacer{flex:1}
  aside,main,#rechts{overflow-y:auto;min-height:0}
  aside{background:var(--mantle);border-right:1px solid var(--surface0);padding:10px}
  #rechts{background:var(--mantle);border-left:1px solid var(--surface0);padding:10px}
  h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--overlay);margin:4px 0 8px}
  .agent{border:1px solid var(--surface0);border-radius:8px;padding:8px 10px;margin-bottom:8px;
    background:var(--base);cursor:pointer}
  .agent:hover{border-color:var(--surface2)}
  .agent.aktiv{border-color:var(--akzent)}
  .agent .kopf{display:flex;align-items:center;gap:6px;justify-content:space-between}
  .agent .name{font:12px/1.3 var(--mono);font-weight:600}
  .punkt{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--overlay)}
  .punkt.starting,.punkt.queued{background:var(--overlay)}
  .punkt.thinking{background:var(--denkt);animation:puls 1.4s infinite}
  .punkt.tool{background:var(--werkzeug);animation:puls 1.4s infinite}
  .punkt.writing{background:var(--lauf);animation:puls 1.4s infinite}
  .punkt.waiting_permission,.punkt.waiting_ratelimit{background:var(--wartet)}
  .punkt.done{background:var(--fertig)}
  .punkt.failed{background:var(--fehler)}
  .punkt.stopped{background:var(--surface2)}
  @keyframes puls{0%,100%{opacity:1}50%{opacity:.35}}
  .agent .meta{font:10px/1.5 var(--mono);color:var(--overlay);margin-top:4px}
  main{padding:0;display:flex;flex-direction:column;min-height:0}
  #graphbox{border-bottom:1px solid var(--surface0);background:var(--crust);
    position:relative;flex:0 0 auto}
  #graphkopf{display:flex;align-items:center;gap:8px;padding:6px 12px 0}
  #graphkopf h2{margin:0}
  #graphkopf .spacer{flex:1}
  #graphklapp{background:none;border:0;color:var(--overlay);cursor:pointer;
    font:11px/1 var(--mono);padding:4px 6px}
  #graphklapp:hover{color:var(--text)}
  #graph,#zeitachse{display:block;width:100%;padding:4px 0 10px}
  /* Nicht das hidden-Attribut: bei SVG reflektiert die gleichnamige
     JS-Eigenschaft nicht darauf, das Umschalten waere wirkungslos. */
  #graph.weg,#zeitachse.weg{display:none}
  #graphbox.zu #graph,#graphbox.zu #zeitachse{display:none}
  #ansichtwahl{display:flex;gap:2px;background:var(--surface0);border-radius:6px;padding:2px}
  #ansichtwahl button{background:none;border:0;color:var(--overlay);cursor:pointer;
    font:10.5px/1 var(--sans);padding:5px 9px;border-radius:4px}
  #ansichtwahl button.an{background:var(--base);color:var(--text)}
  .kante-puls{opacity:0}
  .kante-puls.puls{animation:kanteAuf 1.1s ease-out}
  @keyframes kanteAuf{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
  .pulspunkt{animation:puls 1.4s infinite}
  .knoten:hover rect:first-of-type{stroke:var(--surface2)}
  #filterhinweis{display:none;align-items:center;gap:8px;padding:5px 12px;
    background:color-mix(in srgb,var(--akzent) 10%,transparent);
    border-bottom:1px solid var(--surface0);font:11px/1.4 var(--mono);color:var(--akzent)}
  #filterhinweis.an{display:flex}
  #filterweg{background:var(--surface0);color:var(--text);border:0;border-radius:4px;
    padding:3px 7px;font:11px/1 var(--sans);cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:10px 14px;font:12px/1.65 var(--mono)}
  .zeile{display:grid;grid-template-columns:62px 132px 1fr;gap:10px;padding:2px 0;
    border-bottom:1px solid color-mix(in srgb,var(--surface0) 45%,transparent)}
  .zeile .zeit{color:var(--overlay)}
  .zeile .wer{color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zeile.protokoll .wer{color:var(--akzent)}
  .zeile .was{white-space:pre-wrap;word-break:break-word}
  .k-text .was{color:var(--text)}
  .k-thinking .was{color:var(--denkt)}
  .k-tool_use .was{color:var(--werkzeug)}
  .k-tool_result .was{color:var(--subtext)}
  .k-error .was,.k-rate_limit .was{color:var(--fehler)}
  .k-result .was{color:var(--fertig)}
  .k-permission_request .was{color:var(--wartet)}
  .k-permission_decision .was{color:var(--akzent)}
  .k-agent_start .was{color:var(--lauf)}
  .k-hook .was{color:var(--overlay)}
  .k-usage .was{color:var(--akzent);opacity:.75}
  .zeile.protokoll{background:color-mix(in srgb,var(--akzent) 7%,transparent);
    border-bottom-color:color-mix(in srgb,var(--akzent) 25%,transparent)}
  .zeile.protokoll .was{color:var(--akzent);font-weight:600}
  .zeile.fall-entscheidung .was{color:var(--wartet)}
  .zeile.fall-fertig .was{color:var(--fertig)}
  .zeile.fall-lesen .was{color:var(--denkt)}
  .zeile.blocker .was{color:var(--fehler);font-weight:600}
  .agent.rolle-orchestrator{border-left:3px solid var(--akzent)}
  .agent.rolle-worker{border-left:3px solid var(--lauf);margin-left:10px}
  .ende{margin:10px 0;padding:10px 12px;border-radius:8px;font:12px/1.5 var(--mono);
    border:1px solid var(--surface1);background:var(--mantle)}
  .ende.gut{border-color:var(--fertig);color:var(--fertig)}
  .ende.frage{border-color:var(--wartet);color:var(--wartet)}
  .ende.schlecht{border-color:var(--fehler);color:var(--fehler)}
  #eingabe{border-top:1px solid var(--surface0);background:var(--mantle);padding:10px 14px;display:flex;gap:8px}
  textarea,input,select{background:var(--crust);color:var(--text);border:1px solid var(--surface0);
    border-radius:6px;padding:8px 10px;font:12px/1.5 var(--mono);resize:none}
  textarea{flex:1;min-height:38px;max-height:140px}
  button{background:var(--akzent);color:var(--crust);border:0;border-radius:6px;padding:8px 14px;
    font:600 12px/1 var(--sans);cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button.still{background:var(--surface0);color:var(--text)}
  button.ja{background:var(--fertig);color:var(--crust)}
  button.nein{background:var(--fehler);color:var(--crust)}
  .freigabe{border:1px solid var(--wartet);border-radius:8px;padding:10px;margin-bottom:8px;
    background:color-mix(in srgb,var(--wartet) 8%,var(--base))}
  .freigabe .werkzeug{font:600 12px/1.3 var(--mono);color:var(--wartet)}
  .freigabe pre{font:10px/1.45 var(--mono);color:var(--subtext);background:var(--crust);
    padding:6px;border-radius:4px;max-height:120px;overflow:auto;margin:6px 0}
  .freigabe .knoepfe{display:flex;gap:6px}
  .leer{color:var(--overlay);font-size:12px;padding:6px 2px}
  .zeile.neu{animation:rein .25s ease-out}
  @keyframes rein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Cockpit</h1>
    <span class="pill" id="verbindung">verbinde…</span>
    <span class="pill" id="budget">0 Tokens</span>
    <span class="pill" id="limit" title="Gemessene Auslastung der Nutzungsfenster">Fenster —</span>
    <div class="spacer"></div>
    <select id="laufwahl" title="Lauf"></select>
    <button class="still" id="neu">Neuer Lauf</button>
  </header>

  <aside>
    <h2>Agenten</h2>
    <div id="agenten"><div class="leer">noch keine</div></div>
  </aside>

  <main>
    <div id="graphbox">
      <div id="graphkopf">
        <h2 id="ansichttitel">Agentengraph</h2>
        <div class="spacer"></div>
        <div id="ansichtwahl">
          <button class="an" data-ansicht="graph">Graph</button>
          <button data-ansicht="zeit">Zeitachse</button>
        </div>
        <button id="graphklapp" title="Bereich ein- oder ausklappen">einklappen</button>
      </div>
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="zeitachse" class="weg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="filterhinweis">
      <span id="filtertext"></span>
      <button id="filterweg">alle zeigen</button>
    </div>
    <div id="log"></div>
    <div id="eingabe">
      <textarea id="prompt" placeholder="Auftrag an den Agenten… (Strg+Enter sendet)"></textarea>
      <button id="senden">Start</button>
    </div>
  </main>

  <div id="rechts">
    <h2>Freigaben</h2>
    <div id="freigaben"><div class="leer">keine offen</div></div>
  </div>
</div>

<script type="module">
import { Agentengraph } from './graph.js'
import { Zeitachse } from './zeitachse.js'

const $ = (s) => document.querySelector(s)

// Wohin der Client spricht.
//
// Im Browser ist das der Host, von dem die Seite kam. Im Tauri-Fenster nicht:
// dort ist location.host die App selbst. Die Huelle reicht die Adresse des
// Daemons durch, damit dieselbe Oberflaeche lokal, im Tailnet und in der App
// funktioniert, ohne neu gebaut zu werden.
let BASIS = location.host
let IN_TAURI = false

async function basisErmitteln() {
  const tauri = window.__TAURI__
  if (!tauri?.core?.invoke) return
  IN_TAURI = true
  try {
    const adresse = await tauri.core.invoke('daemon_basis')
    if (adresse) BASIS = adresse
  } catch (e) {
    console.warn('Daemon-Adresse nicht ermittelbar, bleibe bei', BASIS, e)
  }
}

const api = (pfad) => `http://${BASIS}${pfad}`
const wsUrl = () => {
  // Im Browser das Schema der Seite uebernehmen (hinter tailscale serve ist
  // das https und damit wss); in der App immer ws, weil dort kein TLS-Kontext
  // von der Seite kommt -- ausser die Adresse nennt ausdruecklich einen.
  const sicher = !IN_TAURI && location.protocol === 'https:'
  return `${sicher ? 'wss' : 'ws'}://${BASIS}/ws`
}
const logEl = $('#log'), agentenEl = $('#agenten'), freigabenEl = $('#freigaben')
const verbindungEl = $('#verbindung'), budgetEl = $('#budget'), laufwahlEl = $('#laufwahl')
const limitEl = $('#limit')

let runId = new URLSearchParams(location.search).get('run') || null
let letzteSeq = 0
let agenten = new Map()
let freigaben = new Map()
let gewaehlterAgent = null
let sock = null
let graph = null
let zeitachse = null

const zeit = (ts) => new Date(ts).toLocaleTimeString('de-DE', { hour12: false })
const zahl = (n) => new Intl.NumberFormat('de-DE').format(Math.round(n))

function verbinden() {
  sock = new WebSocket(wsUrl())
  sock.onopen = () => {
    verbindungEl.textContent = 'verbunden'
    verbindungEl.className = 'pill an'
    sock.send(JSON.stringify({ typ: 'folgen', runId, seit: letzteSeq }))
  }
  sock.onclose = () => {
    verbindungEl.textContent = 'getrennt — neuer Versuch'
    verbindungEl.className = 'pill ab'
    // Wiederverbinden mit Backfill ab letzteSeq: kein Loch im Verlauf.
    setTimeout(verbinden, 1500)
  }
  sock.onmessage = (ev) => {
    const { typ, daten } = JSON.parse(ev.data)
    if (typ === 'ereignis') ereignisAnhaengen(daten)
    else if (typ === 'agent') agentSetzen(daten)
    else if (typ === 'agenten') daten.forEach((a) => agentSetzen(umbenennen(a)))
    else if (typ === 'freigabe') freigabeSetzen(daten)
    else if (typ === 'freigaben') daten.forEach((f) => freigabeSetzen(umbenennen(f)))
    else if (typ === 'limit') limitZeichnen(daten)
    // 'orchestrator' wird bewusst ignoriert: dieselben Schritte kommen als
    // persistiertes 'protocol'-Ereignis durch, und die ueberleben einen
    // Neustart. Zwei Quellen fuer dieselbe Zeile hiesse sie doppelt zu zeigen.
    else if (typ === 'lauf_ende') endeAnhaengen(daten.ende)
  }
}

// Die REST-Antworten kommen in SQL-Schreibweise (snake_case), der Live-Strom in
// camelCase. Hier auf eine Form bringen, damit die Anzeige nur eine kennt.
function umbenennen(o) {
  const m = {
    agent_id:'agentId', run_id:'runId', session_id:'sessionId', parent_agent_id:'parentAgentId',
    started_at:'startedAt', ended_at:'endedAt', weighted_tokens:'weightedTokens',
    raw_tokens:'rawTokens', cost_usd:'costUsd', last_error:'lastError',
    tool_name:'toolName', requested_at:'requestedAt', decided_at:'decidedAt',
  }
  const r = {}
  for (const [k, v] of Object.entries(o)) r[m[k] ?? k] = v
  if (typeof r.input === 'string') { try { r.input = JSON.parse(r.input) } catch {} }
  return r
}

function ereignisAnhaengen(e, lebend = true) {
  if (e.seq > letzteSeq) letzteSeq = e.seq
  // Nur bei laufenden Ereignissen aufleuchten lassen; beim Nachladen eines
  // alten Laufs waere ein Gewitter aus Animationen nur Unruhe.
  if (lebend && e.kind !== 'protocol') graph?.puls(e.agentId)
  // Protokollschritte gehoeren zum Lauf, nicht zu einem Agenten -- sie bleiben
  // sichtbar, auch wenn nach einem einzelnen Agenten gefiltert wird.
  if (gewaehlterAgent && e.agentId !== gewaehlterAgent && e.kind !== 'protocol') return
  const unten = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60
  const div = document.createElement('div')
  const fall = e.kind === 'protocol' ? fallKlasse(e.summary) : ''
  div.className = `zeile k-${e.kind} neu` + (e.kind === 'protocol' ? ` protokoll ${fall}` : '')
  div.innerHTML =
    `<span class="zeit"></span><span class="wer"></span><span class="was"></span>`
  div.children[0].textContent = zeit(e.ts)
  div.children[1].textContent = e.agentId
  div.children[2].textContent = e.summary
  logEl.appendChild(div)
  while (logEl.children.length > 2000) logEl.removeChild(logEl.firstChild)
  if (unten) logEl.scrollTop = logEl.scrollHeight
}

// Ereignisse der Orchestrator-Engine -- keine Agentennachrichten, sondern
// Schritte des Protokolls. Sie bekommen eine eigene, hervorgehobene Zeile,
// weil sie den Lauf steuern.
function fallKlasse(summary) {
  if (/^Fall B/.test(summary)) return 'fall-entscheidung'
  if (/^Fall C/.test(summary)) return 'fall-fertig'
  if (/^Fall D/.test(summary) || /^Leseanfrage/.test(summary)) return 'fall-lesen'
  if (/^BLOCKER|Report ohne/.test(summary)) return 'blocker'
  return ''
}

function endeAnhaengen(ende) {
  const gut = ende.grund === 'fertig'
  const frage = ende.grund === 'entscheidung'
  const texte = {
    fertig: 'Lauf fertig', entscheidung: 'Entscheidung noetig', rundenlimit: 'Rundenlimit erreicht',
    wiederholung: 'Gestoppt: der Lauf drehte sich im Kreis', budget: 'Gestoppt: Tokenbudget erschoepft',
    formatfehler: 'Gestoppt: Formatfehler des Orchestrators', blocker: 'Gestoppt: Blocker nicht behandelt',
    abgebrochen: 'Abgebrochen', fehler: 'Fehler',
  }
  const div = document.createElement('div')
  div.className = 'ende ' + (gut ? 'gut' : frage ? 'frage' : 'schlecht')
  div.textContent = (texte[ende.grund] ?? ende.grund) +
    (ende.text ? `\n\n${ende.text}` : '') + (ende.frage ? `\n\n${ende.frage}` : '') +
    (ende.verbraucht ? `\n\n${zahl(ende.verbraucht)} gewichtete Tokens verbraucht` : '')
  div.style.whiteSpace = 'pre-wrap'
  logEl.appendChild(div)
  logEl.scrollTop = logEl.scrollHeight
}

function agentSetzen(a) {
  agenten.set(a.agentId, { ...(agenten.get(a.agentId) ?? {}), ...a })
  agentenZeichnen()
  budgetZeichnen()
  graph?.setzen([...agenten.values()])
  zeitachse?.setzen([...agenten.values()])
}

function agentenZeichnen() {
  if (agenten.size === 0) { agentenEl.innerHTML = '<div class="leer">noch keine</div>'; return }
  agentenEl.innerHTML = ''
  for (const a of agenten.values()) {
    const d = document.createElement('div')
    d.className = 'agent rolle-' + (a.role ?? 'chat') +
      (gewaehlterAgent === a.agentId ? ' aktiv' : '')
    const dauer = ((a.endedAt ?? Date.now()) - a.startedAt) / 1000
    d.innerHTML = `<div class="kopf">
        <span class="name"></span><span class="punkt ${a.status}"></span>
      </div>
      <div class="meta"></div>`
    d.querySelector('.name').textContent = a.label || a.agentId
    d.querySelector('.meta').textContent =
      `${a.status} · ${zahl(a.weightedTokens ?? 0)} gew. · ${dauer.toFixed(0)}s` +
      (a.role ? ` · ${a.role}` : '')
    d.onclick = () => {
      agentWaehlen(gewaehlterAgent === a.agentId ? null : a.agentId)
    }
    agentenEl.appendChild(d)
  }
}

/**
 * Einen Agenten auswaehlen. Graph, Liste und Log zeigen danach dasselbe --
 * ohne diese Verknuepfung muesste man bei jeder Frage selbst zwischen den
 * Ansichten uebersetzen, und genau daran scheitern solche Fenster meistens.
 */
function agentWaehlen(agentId) {
  gewaehlterAgent = agentId
  graph?.auswaehlen(agentId)
  zeitachse?.auswaehlen(agentId)
  agentenZeichnen()
  const hinweis = $('#filterhinweis')
  if (agentId) {
    const a = agenten.get(agentId)
    $('#filtertext').textContent = `nur ${a?.label || agentId}`
    hinweis.classList.add('an')
  } else {
    hinweis.classList.remove('an')
  }
  logNeuLaden()
}

function budgetZeichnen() {
  let gew = 0, roh = 0, usd = 0
  for (const a of agenten.values()) {
    gew += a.weightedTokens ?? 0; roh += a.rawTokens ?? 0; usd += a.costUsd ?? 0
  }
  budgetEl.textContent = `${zahl(gew)} gew. / ${zahl(roh)} roh${usd ? ` · ${usd.toFixed(2)} $` : ''}`
  budgetEl.className = 'pill' + (gew > 600000 ? ' ab' : '')
  budgetEl.title = 'Gewichtet nach loop.py-Gewichten; 600.000 ist dort die Budgetgrenze je Lauf'
}

function limitZeichnen(l) {
  if (!l) return
  const p = (x) => (typeof x === 'number' ? Math.round(x * 100) + ' %' : '—')
  const reset = l.fuenfStundenResetsAt
    ? new Date(l.fuenfStundenResetsAt * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
    : '—'
  limitEl.textContent = `5h ${p(l.fuenfStundenAnteil)} · Woche ${p(l.siebenTageAnteil)} · Reset ${reset}`
  const eng = (l.fuenfStundenAnteil ?? 0) > 0.8 || (l.siebenTageAnteil ?? 0) > 0.8
  limitEl.className = 'pill' + (l.status !== 'allowed' ? ' ab' : eng ? ' ab' : ' an')
  limitEl.title = `Status: ${l.status}${l.rateLimitType ? ' · ' + l.rateLimitType : ''}` +
    ' — gemessene Werte vom Server, keine Schaetzung'
}

function freigabeSetzen(f) {
  if (f.decidedAt) freigaben.delete(f.id); else freigaben.set(f.id, f)
  freigabenZeichnen()
}

function freigabenZeichnen() {
  if (freigaben.size === 0) { freigabenEl.innerHTML = '<div class="leer">keine offen</div>'; return }
  freigabenEl.innerHTML = ''
  for (const f of freigaben.values()) {
    const d = document.createElement('div')
    d.className = 'freigabe'
    d.innerHTML = `<div class="werkzeug"></div><div class="meta"></div>
      <pre></pre><div class="knoepfe">
        <button class="ja">Erlauben</button><button class="nein">Ablehnen</button>
      </div>`
    d.querySelector('.werkzeug').textContent = f.toolName
    d.querySelector('.meta').textContent = `${f.agentId} · ${zeit(f.requestedAt)}`
    d.querySelector('pre').textContent = JSON.stringify(f.input, null, 1).slice(0, 1200)
    d.querySelector('.ja').onclick = () => entscheiden(f.id, true)
    d.querySelector('.nein').onclick = () => entscheiden(f.id, false)
    freigabenEl.appendChild(d)
  }
}

async function entscheiden(id, erlaubt) {
  await fetch(api('/api/freigabe'), {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id, erlaubt, durch: 'ui' }),
  })
  freigaben.delete(id)
  freigabenZeichnen()
}

async function logNeuLaden() {
  if (!runId) return
  logEl.innerHTML = ''
  const r = await fetch(api(`/api/lauf/${runId}?seit=0`)).then((x) => x.json())
  agenten = new Map(r.agenten.map((a) => { const b = umbenennen(a); return [b.agentId, b] }))
  freigaben = new Map(r.freigaben.map((f) => { const b = umbenennen(f); return [b.id, b] }))
  letzteSeq = 0
  for (const e of r.ereignisse) ereignisAnhaengen(e, false)
  agentenZeichnen(); freigabenZeichnen(); budgetZeichnen()
  graph?.setzen([...agenten.values()])
  zeitachse?.setzen([...agenten.values()])
  zeitachse?.setzen([...agenten.values()])
}

async function laeufeLaden() {
  let r
  try {
    r = await fetch(api('/api/laeufe')).then((x) => x.json())
  } catch (e) {
    // Haeufigster Fall in der App: der Daemon laeuft nicht. Das gehoert
    // gesagt, nicht als leeres Fenster praesentiert.
    verbindungEl.textContent = `kein Daemon auf ${BASIS}`
    verbindungEl.className = 'pill ab'
    logEl.innerHTML =
      `<div class="ende schlecht">Kein Daemon erreichbar auf ${BASIS}.\n\n` +
      `Starten:  cd ~/projekte/cockpit && node dist/daemon.js\n` +
      `Andere Adresse:  COCKPIT_DAEMON=100.126.179.60:8765 cockpit</div>`
    logEl.firstChild.style.whiteSpace = 'pre-wrap'
    return
  }
  laufwahlEl.innerHTML = ''
  for (const l of r.laeufe) {
    const o = document.createElement('option')
    o.value = l.run_id
    o.textContent = `${l.label} · ${zeit(l.started_at)} · ${l.status}`
    laufwahlEl.appendChild(o)
  }
  if (!runId && r.laeufe.length > 0) runId = r.laeufe[0].run_id
  if (runId) laufwahlEl.value = runId
}

laufwahlEl.onchange = async () => {
  runId = laufwahlEl.value
  history.replaceState(null, '', `?run=${runId}`)
  await logNeuLaden()
  sock?.send(JSON.stringify({ typ: 'folgen', runId, seit: 0 }))
}

$('#neu').onclick = () => { runId = null; agenten.clear(); freigaben.clear(); logEl.innerHTML = ''
  agentenZeichnen(); freigabenZeichnen(); $('#prompt').focus() }

async function starten() {
  const prompt = $('#prompt').value.trim()
  if (!prompt) return
  $('#senden').disabled = true
  try {
    const r = await fetch(api('/api/lauf'), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ prompt, label: prompt.slice(0, 40), cwd: null }),
    }).then((x) => x.json())
    if (r.runId) {
      runId = r.runId
      letzteSeq = 0
      logEl.innerHTML = ''
      agenten.clear(); freigaben.clear()
      $('#prompt').value = ''
      history.replaceState(null, '', `?run=${runId}`)
      sock?.send(JSON.stringify({ typ: 'folgen', runId, seit: 0 }))
      await laeufeLaden()
    } else {
      alert('Start fehlgeschlagen: ' + JSON.stringify(r))
    }
  } finally {
    $('#senden').disabled = false
  }
}

$('#senden').onclick = starten
$('#prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); starten() }
})

// Dauer-Anzeige der laufenden Agenten mitlaufen lassen.
setInterval(() => {
  if (![...agenten.values()].some((a) => !a.endedAt)) return
  agentenZeichnen()
  if (!$('#zeitachse').classList.contains('weg')) zeitachse?.zeichnen()
}, 1000)

graph = new Agentengraph($('#graph'), agentWaehlen)
zeitachse = new Zeitachse($('#zeitachse'), agentWaehlen)

for (const b of document.querySelectorAll('#ansichtwahl button')) {
  b.onclick = () => {
    const ansicht = b.dataset.ansicht
    for (const x of document.querySelectorAll('#ansichtwahl button')) x.classList.toggle('an', x === b)
    $('#graph').classList.toggle('weg', ansicht !== 'graph')
    $('#zeitachse').classList.toggle('weg', ansicht !== 'zeit')
    $('#ansichttitel').textContent = ansicht === 'graph' ? 'Agentengraph' : 'Zeitachse'
    // Nach dem Einblenden neu legen: ein verstecktes SVG hat Breite 0, die
    // Positionen waeren sonst auf der alten Rechnung stehengeblieben.
    if (ansicht === 'graph') graph.zeichnen()
    else zeitachse.zeichnen()
  }
}

$('#filterweg').onclick = () => agentWaehlen(null)
$('#graphklapp').onclick = () => {
  const box = $('#graphbox')
  box.classList.toggle('zu')
  $('#graphklapp').textContent = box.classList.contains('zu') ? 'ausklappen' : 'einklappen'
}
// Der Graph rechnet mit der Breite des Fensters -- nach einer Groessenaenderung
// muss er neu gelegt werden, sonst stehen die Knoten falsch oder ausserhalb.
let legeNeu
addEventListener('resize', () => {
  clearTimeout(legeNeu)
  legeNeu = setTimeout(() => {
    if (!$('#graph').classList.contains('weg')) graph?.zeichnen()
    if (!$('#zeitachse').classList.contains('weg')) zeitachse?.zeichnen()
  }, 120)
})

await basisErmitteln()
await laeufeLaden()
if (runId) await logNeuLaden()
try { limitZeichnen((await fetch(api('/api/gesundheit')).then((r) => r.json())).limit) } catch {}
verbinden()
</script>
</body>
</html>
