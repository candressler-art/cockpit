<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit</title>
<link rel="stylesheet" href="./hud.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1e1e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --base:#1e1e2e; --mantle:#181825; --crust:#11111b;
    --surface0:#313244; --surface1:#45475a; --surface2:#585b70;
    --text:#cdd6f4; --subtext:#a6adc8; --overlay:#6c7086;
    --akzent:#89b4fa;
    --lauf:#94e2d5; --denkt:#cba6f7; --werkzeug:#f9e2af;
    --wartet:#fab387; --fehler:#f38ba8; --fertig:#a6e3a1;
    --mono:"JetBrains Mono","Fira Code",ui-monospace,monospace;
    --sans:Inter,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--base);color:var(--text);font:14px/1.5 var(--sans);height:100vh;overflow:hidden}
  #app{display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:44px 34px 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;overflow:hidden;
    background:var(--mantle);border-bottom:1px solid var(--surface0)}
  header h1{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--subtext);margin:0;flex:0 0 auto}
  header select{max-width:230px;flex:0 1 auto}
  header button{flex:0 0 auto;white-space:nowrap}
  .pill{font:11px/1 var(--mono);padding:5px 9px;border-radius:999px;background:var(--surface0);
    color:var(--subtext);white-space:nowrap;flex:0 0 auto}
  .pill.an{background:color-mix(in srgb,var(--lauf) 22%,transparent);color:var(--lauf)}
  .pill.ab{background:color-mix(in srgb,var(--fehler) 22%,transparent);color:var(--fehler)}
  .spacer{flex:1}
  aside,main,#rechts{overflow-y:auto;min-height:0}
  aside{background:var(--mantle);border-right:1px solid var(--surface0);padding:10px}
  #rechts{background:var(--mantle);border-left:1px solid var(--surface0);padding:10px}
  h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--overlay);margin:4px 0 8px}
  .agent{border:1px solid var(--surface0);border-radius:8px;padding:8px 10px;margin-bottom:8px;
    background:var(--base);cursor:pointer}
  .agent:hover{border-color:var(--surface2)}
  .agent.aktiv{border-color:var(--akzent)}
  .agent .kopf{display:flex;align-items:center;gap:6px;justify-content:space-between}
  .agent .name{font:12px/1.3 var(--mono);font-weight:600}
  .punkt{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--overlay)}
  .punkt.starting,.punkt.queued{background:var(--overlay)}
  .punkt.thinking{background:var(--denkt);animation:puls 1.4s infinite}
  .punkt.tool{background:var(--werkzeug);animation:puls 1.4s infinite}
  .punkt.writing{background:var(--lauf);animation:puls 1.4s infinite}
  .punkt.waiting_permission,.punkt.waiting_ratelimit{background:var(--wartet)}
  .punkt.done{background:var(--fertig)}
  .punkt.failed{background:var(--fehler)}
  .punkt.stopped{background:var(--surface2)}
  @keyframes puls{0%,100%{opacity:1}50%{opacity:.35}}
  .agent .meta{font:10px/1.5 var(--mono);color:var(--overlay);margin-top:4px}
  main{padding:0;display:flex;flex-direction:column;min-height:0}
  #graphbox{border-bottom:1px solid var(--surface0);background:var(--crust);
    position:relative;flex:0 0 auto}
  #graphkopf{display:flex;align-items:center;gap:8px;padding:6px 12px 0}
  #graphkopf h2{margin:0}
  #graphkopf .spacer{flex:1}
  #graphklapp{background:none;border:0;color:var(--overlay);cursor:pointer;
    font:11px/1 var(--mono);padding:4px 6px}
  #graphklapp:hover{color:var(--text)}
  #graph,#zeitachse{display:block;width:100%;padding:4px 0 10px}
  /* Nicht das hidden-Attribut: bei SVG reflektiert die gleichnamige
     JS-Eigenschaft nicht darauf, das Umschalten waere wirkungslos. */
  #graph.weg,#zeitachse.weg{display:none}
  #graphbox.zu #graph,#graphbox.zu #zeitachse{display:none}
  #ansichtwahl{display:flex;gap:2px;background:var(--surface0);border-radius:6px;padding:2px}
  #ansichtwahl button{background:none;border:0;color:var(--overlay);cursor:pointer;
    font:10.5px/1 var(--sans);padding:5px 9px;border-radius:4px}
  #ansichtwahl button.an{background:var(--base);color:var(--text)}
  .kante-puls{opacity:0}
  .kante-puls.puls{animation:kanteAuf 1.1s ease-out}
  @keyframes kanteAuf{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
  .pulspunkt{animation:puls 1.4s infinite}
  .knoten:hover rect:first-of-type{stroke:var(--surface2)}
  #filterhinweis{display:none;align-items:center;gap:8px;padding:5px 12px;
    background:color-mix(in srgb,var(--akzent) 10%,transparent);
    border-bottom:1px solid var(--surface0);font:11px/1.4 var(--mono);color:var(--akzent)}
  #filterhinweis.an{display:flex}
  #filterweg{background:var(--surface0);color:var(--text);border:0;border-radius:4px;
    padding:3px 7px;font:11px/1 var(--sans);cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:10px 14px;font:12px/1.65 var(--mono)}
  .zeile{display:grid;grid-template-columns:62px 132px 1fr;gap:10px;padding:2px 0;
    border-bottom:1px solid color-mix(in srgb,var(--surface0) 45%,transparent)}
  .zeile .zeit{color:var(--overlay)}
  .zeile .wer{color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zeile.protokoll .wer{color:var(--akzent)}
  .zeile .was{white-space:pre-wrap;word-break:break-word}
  .k-text .was{color:var(--text)}
  .k-thinking .was{color:var(--denkt)}
  .k-tool_use .was{color:var(--werkzeug)}
  .k-tool_result .was{color:var(--subtext)}
  .k-error .was,.k-rate_limit .was{color:var(--fehler)}
  .k-result .was{color:var(--fertig)}
  .k-permission_request .was{color:var(--wartet)}
  .k-permission_decision .was{color:var(--akzent)}
  .k-agent_start .was{color:var(--lauf)}
  .k-hook .was{color:var(--overlay)}
  .k-usage .was{color:var(--akzent);opacity:.75}
  .zeile.protokoll{background:color-mix(in srgb,var(--akzent) 7%,transparent);
    border-bottom-color:color-mix(in srgb,var(--akzent) 25%,transparent)}
  .zeile.protokoll .was{color:var(--akzent);font-weight:600}
  .zeile.fall-entscheidung .was{color:var(--wartet)}
  .zeile.fall-fertig .was{color:var(--fertig)}
  .zeile.fall-lesen .was{color:var(--denkt)}
  .zeile.blocker .was{color:var(--fehler);font-weight:600}
  .agent.rolle-orchestrator{border-left:3px solid var(--akzent)}
  .agent.rolle-worker{border-left:3px solid var(--lauf);margin-left:10px}
  .ende{margin:10px 0;padding:10px 12px;border-radius:8px;font:12px/1.5 var(--mono);
    border:1px solid var(--surface1);background:var(--mantle)}
  .ende.gut{border-color:var(--fertig);color:var(--fertig)}
  .ende.frage{border-color:var(--wartet);color:var(--wartet)}
  .ende.schlecht{border-color:var(--fehler);color:var(--fehler)}
  #eingabe{border-top:1px solid var(--surface0);background:var(--mantle);padding:10px 14px;display:flex;gap:8px}
  textarea,input,select{background:var(--crust);color:var(--text);border:1px solid var(--surface0);
    border-radius:6px;padding:8px 10px;font:12px/1.5 var(--mono);resize:none}
  textarea{flex:1;min-height:38px;max-height:140px}
  button{background:var(--akzent);color:var(--crust);border:0;border-radius:6px;padding:8px 14px;
    font:600 12px/1 var(--sans);cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button.still{background:var(--surface0);color:var(--text)}
  button.ja{background:var(--fertig);color:var(--crust)}
  button.nein{background:var(--fehler);color:var(--crust)}
  .freigabe{border:1px solid var(--wartet);border-radius:8px;padding:10px;margin-bottom:8px;
    background:color-mix(in srgb,var(--wartet) 8%,var(--base))}
  .freigabe .werkzeug{font:600 12px/1.3 var(--mono);color:var(--wartet)}
  .freigabe pre{font:10px/1.45 var(--mono);color:var(--subtext);background:var(--crust);
    padding:6px;border-radius:4px;max-height:120px;overflow:auto;margin:6px 0}
  .freigabe .knoepfe{display:flex;gap:6px}
  .leer{color:var(--overlay);font-size:12px;padding:6px 2px}
  .zeile.neu{animation:rein .25s ease-out}
  @keyframes rein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  /* --- Tabs --------------------------------------------------------------
   * Die Lauf-Ansicht behaelt das dreispaltige Grid; alle anderen Tabs
   * bekommen eine Flaeche ueber die volle Breite. Umgeschaltet wird ueber
   * #app.nur-lauf, damit aside/main/#rechts direkte Grid-Kinder bleiben --
   * in einen Wrapper gepackt waere das Layout hin. */
  #tableiste{grid-column:1/-1;grid-row:2;display:flex;align-items:stretch;gap:2px;
    padding:0 10px;background:var(--mantle);border-bottom:1px solid var(--surface0)}
  #tableiste button{display:flex;align-items:center;gap:6px;border:0;background:none;
    color:var(--subtext);font:12px/1 var(--sans);padding:0 12px;cursor:pointer;
    border-bottom:2px solid transparent}
  #tableiste button:hover{color:var(--text)}
  #tableiste button.an{color:var(--akzent);border-bottom-color:var(--akzent)}
  #tableiste .sym{font-size:13px;line-height:1}
  aside,main,#rechts{grid-row:3}
  .tabflaeche{grid-column:1/-1;grid-row:3;overflow:auto;padding:16px;display:none}
  .tabflaeche.an{display:block}
  #app:not(.nur-lauf)>aside,#app:not(.nur-lauf)>main,#app:not(.nur-lauf)>#rechts{display:none}
  .schubladenknopf{display:none}

  /* --- Handy -------------------------------------------------------------
   * Eine Spalte, Tableiste an den unteren Rand (Daumenreichweite). Agenten
   * und Freigaben werden zu Schubladen, die ueber den Inhalt fahren -- auf
   * 375px Breite waere eine dritte Spalte nicht lesbar. */
  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-rows:44px 1fr 54px}
    /* Die Kopfzeile hatte overflow:hidden und ein festes Raster -- auf 375px
       wurden Laufwahl, Stimme und der rechte Schubladenknopf schlicht
       abgeschnitten und waren nicht mehr erreichbar. Jetzt scrollt sie
       waagerecht, und was nur schmueckt, faellt vorher weg. */
    header{grid-row:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:7px}
    header::-webkit-scrollbar{display:none}
    header h1{display:none}
    header #budget{display:none}
    header select{max-width:130px}
    header .spacer{flex:0 0 4px}
    #tableiste{grid-row:3;padding:0;justify-content:space-around;
      border-bottom:0;border-top:1px solid var(--surface0)}
    #tableiste button{flex:1;flex-direction:column;gap:3px;justify-content:center;
      font-size:10px;padding:0;border-bottom:0;border-top:2px solid transparent}
    #tableiste button.an{border-top-color:var(--akzent)}
    #tableiste .sym{font-size:16px}
    main,.tabflaeche{grid-row:2;grid-column:1}
    aside,#rechts{position:fixed;top:44px;bottom:54px;width:min(84vw,320px);z-index:20;
      transition:transform .18s ease-out;box-shadow:0 0 24px #0008}
    aside{left:0;transform:translateX(-100%)}
    #rechts{right:0;transform:translateX(100%)}
    #app.schublade-links>aside{transform:none}
    #app.schublade-rechts>#rechts{transform:none}
    #app.nur-lauf .schubladenknopf{display:inline-flex}
    /* Der Deckel allein reicht nicht: das SVG behaelt seine volle Hoehe und
       lief mit overflow:visible ueber den Rand ins Log. Sichtbar wurde das
       erst auf schmalen Schirmen, wo der Graph hoeher wird als der Deckel. */
    #graphbox{max-height:38vh;overflow:auto}
  }
  /* --- Tab "Server" ------------------------------------------------------ */
  .hostliste{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .hostkarte{border:1px solid var(--surface0);border-radius:10px;background:var(--mantle);
    padding:12px 14px}
  .hostkopf{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .hostkopf h3{margin:0;font-size:14px;font-weight:600}
  .ampel{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--overlay)}
  .ampel.an{background:var(--fertig)} .ampel.ab{background:var(--fehler)}
  .quelle{font:10px/1 var(--mono);color:var(--overlay);border:1px solid var(--surface0);
    border-radius:999px;padding:3px 7px}
  .messungen{display:flex;gap:6px;justify-content:space-around;text-align:center}
  .messung{flex:1;min-width:0}
  .ring{width:64px;height:64px;transform:rotate(-90deg)}
  .ring .bahn{fill:none;stroke:var(--surface0);stroke-width:6}
  .ring .fuellung{fill:none;stroke:var(--fertig);stroke-width:6;stroke-linecap:round;
    transition:stroke-dasharray .4s ease-out}
  .messung.warm .ring .fuellung,.pill.warm{stroke:var(--werkzeug);color:var(--werkzeug)}
  .messung.heiss .ring .fuellung,.pill.heiss{stroke:var(--fehler);color:var(--fehler)}
  .messung.unbekannt .ring .fuellung{stroke:var(--surface2)}
  .messung .wert{font:13px/1.2 var(--mono);margin-top:-6px}
  .messung .was{font-size:11px;color:var(--subtext);margin-top:2px}
  .messung .zusatz{font-size:10px;color:var(--overlay)}
  .hinweis{border:1px solid var(--surface0);border-left:3px solid var(--werkzeug);
    border-radius:6px;padding:9px 12px;margin-bottom:14px;font-size:12px;color:var(--subtext)}
  .hinweis code{font:11px/1 var(--mono);background:var(--crust);padding:2px 5px;border-radius:3px}
  /* Konten -- dieselbe Kartensprache wie die Hosts (.hostkarte, siehe hud.css
     fuer die Eckklammern), nur mit einer Zeile statt Ringen. */
  .kontoliste{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:18px}
  .kontokarte{padding:10px 14px}
  .kontozeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .kontoemail{font-size:11px;color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  #stimmwahl{flex:0 0 auto;max-width:130px}
  @media (max-width:820px){ #stimmwahl{max-width:52px} }
  /* --- Tab "Chats" -------------------------------------------------------- */
  .chatkopf{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  #chatsuche{flex:1;background:var(--crust);border:1px solid var(--surface0);border-radius:8px;
    color:var(--text);font:13px var(--sans);padding:8px 12px}
  #chatsuche:focus{outline:none;border-color:var(--akzent)}
  .chatspalten{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;
    height:calc(100% - 46px);min-height:0}
  #chatliste{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:6px}
  #chatlese{overflow-y:auto;min-height:0;border-left:1px solid var(--surface0);padding-left:14px}
  .chateintrag{text-align:left;background:var(--mantle);border:1px solid var(--surface0);
    border-radius:8px;padding:9px 11px;cursor:pointer;color:var(--text);font:inherit;width:100%}
  .chateintrag:hover{border-color:var(--surface2)}
  .chateintrag.an{border-color:var(--akzent);
    background:color-mix(in srgb,var(--akzent) 12%,var(--mantle))}
  .cheintitel{font-size:12.5px;font-weight:600;margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cheinmeta{display:flex;flex-wrap:wrap;gap:8px;font:10px/1.5 var(--mono);color:var(--overlay)}
  .cheinmeta .ja{color:var(--fertig)} .cheinmeta .nein{color:var(--overlay)}
  .lesekopf{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .lesekopf h3{margin:0;font-size:14px}
  .lesemeta{font:10px var(--mono);color:var(--overlay);margin-bottom:12px}
  .beitrag{border-left:2px solid var(--surface1);padding:0 0 0 10px;margin-bottom:12px}
  .beitrag.user{border-left-color:var(--akzent)}
  .beitrag.assistant{border-left-color:var(--lauf)}
  .brolle{font:10px var(--mono);color:var(--overlay);margin-bottom:3px}
  .beitrag pre{margin:0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;
    color:var(--subtext);max-height:340px;overflow:auto}
  @media (max-width:820px){
    .chatspalten{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #chatlese{border-left:0;border-top:1px solid var(--surface0);padding-left:0;padding-top:12px}
    #chatliste{max-height:38vh}
  }
  /* --- Tab "Vault" -------------------------------------------------------- */
  #tab-vault{padding:0;display:flex;flex-direction:column;overflow:hidden}
  .v-kopf{display:flex;align-items:center;gap:12px;padding:10px 14px;flex:0 0 auto}
  #v-suche{width:min(280px,42vw);background:var(--crust);border:1px solid var(--hud-rand);
    border-radius:7px;color:var(--text);font:12px var(--mono);padding:6px 10px}
  #v-suche:focus{outline:none;border-color:var(--hud)}
  .vhinweis{font:10px var(--mono);color:var(--overlay)}
  #vaultbuehne{position:relative;flex:1;min-height:0;background:var(--crust);overflow:hidden}
  #vaultbuehne canvas{display:block}
  #vaultlabels{position:absolute;inset:0;pointer-events:none}
  /* Die Mitte des Kastens sitzt auf left/top -- so rechnet das Ausweichen
     mit demselben Bezugspunkt, den es auch setzt. */
  .vlabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    font:9.5px/13px var(--mono);color:var(--subtext);text-shadow:0 0 4px #11111b,0 0 9px #11111b}
  .vlinien{position:absolute;inset:0;pointer-events:none}
  .vlinien line{stroke:var(--hud);stroke-width:1}
  .vlabel.treffer{color:#eaffff;font-weight:600;
    text-shadow:0 0 4px #fff,0 0 12px var(--hud),0 0 26px var(--hud)}
  .v-fuss{display:flex;align-items:center;gap:10px;padding:8px 14px;flex:0 0 auto;
    border-top:1px solid var(--hud-rand)}
  .v-agenten{display:flex;gap:9px;flex-wrap:wrap}
  .v-agent{display:inline-flex;align-items:center;gap:5px;font:10px var(--mono)}
  .v-punkt{width:6px;height:6px;border-radius:50%;display:inline-block}
  @media (max-width:820px){
    .v-kopf{flex-wrap:wrap;gap:8px}
    #v-suche{width:100%;order:3}
  }

  /* --- Tab "Chats" -------------------------------------------------------- */
  .chatkopf{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  #chatsuche{flex:1;background:var(--crust);border:1px solid var(--surface0);border-radius:8px;
    color:var(--text);font:13px var(--sans);padding:8px 12px}
  #chatsuche:focus{outline:none;border-color:var(--akzent)}
  .chatspalten{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;
    height:calc(100% - 46px);min-height:0}
  #chatliste{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:6px}
  #chatlese{overflow-y:auto;min-height:0;border-left:1px solid var(--surface0);padding-left:14px}
  .chateintrag{text-align:left;background:var(--mantle);border:1px solid var(--surface0);
    border-radius:8px;padding:9px 11px;cursor:pointer;color:var(--text);font:inherit;width:100%}
  .chateintrag:hover{border-color:var(--surface2)}
  .chateintrag.an{border-color:var(--akzent);
    background:color-mix(in srgb,var(--akzent) 12%,var(--mantle))}
  .cheintitel{font-size:12.5px;font-weight:600;margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cheinmeta{display:flex;flex-wrap:wrap;gap:8px;font:10px/1.5 var(--mono);color:var(--overlay)}
  .cheinmeta .ja{color:var(--fertig)} .cheinmeta .nein{color:var(--overlay)}
  .lesekopf{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .lesekopf h3{margin:0;font-size:14px}
  .lesemeta{font:10px var(--mono);color:var(--overlay);margin-bottom:12px}
  .beitrag{border-left:2px solid var(--surface1);padding:0 0 0 10px;margin-bottom:12px}
  .beitrag.user{border-left-color:var(--akzent)}
  .beitrag.assistant{border-left-color:var(--lauf)}
  .brolle{font:10px var(--mono);color:var(--overlay);margin-bottom:3px}
  .beitrag pre{margin:0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;
    color:var(--subtext);max-height:340px;overflow:auto}
  @media (max-width:820px){
    .chatspalten{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    #chatlese{border-left:0;border-top:1px solid var(--surface0);padding-left:0;padding-top:12px}
    #chatliste{max-height:38vh}
  }
  /* --- Tab "Vault" -------------------------------------------------------- */
  #tab-vault{padding:0;display:flex;flex-direction:column;overflow:hidden}
  .vaultkopf{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:0 0 auto}
  .vhinweis{font:10px var(--mono);color:var(--overlay)}
  #vaultbuehne{position:relative;flex:1;min-height:0;background:var(--crust);overflow:hidden}
  #vaultbuehne canvas{display:block}
  #vaultlabels{position:absolute;inset:0;pointer-events:none}
  .vlabel{position:absolute;transform:translate(-50%,-160%);white-space:nowrap;
    font:9.5px var(--mono);color:var(--subtext);text-shadow:0 0 4px #11111b,0 0 8px #11111b}
  .vlabel.agent{color:var(--akzent);font-weight:600;font-size:10.5px}
  /* --- Tab "Konsole" ------------------------------------------------------ */
  #tab-konsole{padding:0;display:flex;flex-direction:column;overflow:hidden}
  .kwarnung{flex:0 0 auto;margin:14px 14px 10px;padding:9px 12px;font-size:12px;
    color:var(--subtext);border:1px solid var(--surface0);border-radius:6px;
    border-left:3px solid var(--wartet)}
  .kwarnung code{font:11px var(--mono);background:var(--crust);padding:2px 5px;border-radius:3px}
  #kverlauf{flex:1;min-height:0;overflow-y:auto;padding:0 14px}
  .keintrag{border:1px solid var(--surface0);border-radius:8px;background:var(--mantle);
    padding:9px 11px;margin-bottom:9px}
  .kkopf{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .kzeit{font:10px var(--mono);color:var(--overlay);flex:0 0 auto}
  .kbefehl{font:12px var(--mono);color:var(--text);word-break:break-all}
  .kcwdzeile{font:10px var(--mono);color:var(--overlay);margin-top:3px}
  .kstatus{font:10px var(--mono);padding:3px 8px;border-radius:999px;background:var(--surface0);
    white-space:nowrap}
  .kstatus.wartet{color:var(--wartet)} .kstatus.laeuft{color:var(--lauf)}
  .kstatus.gut{color:var(--fertig)} .kstatus.fehler{color:var(--fehler)}
  .kknoepfe{display:flex;gap:7px;margin-top:8px}
  .kknoepfe button{font-size:11px;padding:5px 12px}
  .kknoepfe .gut{background:color-mix(in srgb,var(--fertig) 22%,transparent);color:var(--fertig);
    border-color:color-mix(in srgb,var(--fertig) 40%,transparent)}
  .kknoepfe .schlecht{background:color-mix(in srgb,var(--fehler) 18%,transparent);color:var(--fehler);
    border-color:color-mix(in srgb,var(--fehler) 38%,transparent)}
  .kaus{margin:8px 0 0;font:11px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;
    background:var(--crust);border-radius:5px;padding:8px;max-height:320px;overflow:auto;
    color:var(--subtext)}
  .kerr{color:var(--fehler)}
  #keingabe{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px;
    border-top:1px solid var(--surface0);background:var(--mantle)}
  #kcwd{width:190px;flex:0 0 auto}
  #kbefehl{flex:1;min-width:0}
  #keingabe input{background:var(--crust);border:1px solid var(--surface0);border-radius:6px;
    color:var(--text);font:12px var(--mono);padding:8px 10px}
  #keingabe input:focus{outline:none;border-color:var(--akzent)}
  @media (max-width:820px){
    #keingabe{flex-wrap:wrap}
    #kcwd{width:100%}
  }
  /* --- Tab "Zentrale" ----------------------------------------------------- */
  #tab-zentrale{padding:0;display:flex;flex-direction:column;overflow:hidden}
  .z-raster{flex:1;min-height:0;display:grid;gap:12px;padding:12px;
    grid-template-columns:repeat(4,1fr);grid-template-rows:1.25fr 1fr auto;
    grid-template-areas:"kern kern limit last" "kern kern agenten strom"
      "auftrag auftrag auftrag auftrag"}
  .z-panel{background:var(--mantle);border:1px solid var(--hud-rand);border-radius:10px;
    padding:11px 13px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}
  #z-kern{grid-area:kern;padding:11px} #z-limit{grid-area:limit}
  #z-last{grid-area:last} #z-agenten{grid-area:agenten} #z-strom{grid-area:strom}
  #z-auftrag{grid-area:auftrag}
  #z-auftrag textarea{background:var(--crust);border:1px solid var(--hud-rand);border-radius:7px;
    color:var(--text);font:12px/1.5 var(--mono);padding:8px 10px;resize:vertical}
  #z-auftrag textarea:focus{outline:none;border-color:var(--hud)}
  .z-auftragzeile{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .z-auftragzeile label{font:10px var(--mono);color:var(--subtext);display:flex;
    align-items:center;gap:5px}
  .z-auftragzeile input{background:var(--crust);border:1px solid var(--hud-rand);
    border-radius:6px;color:var(--text);font:11px var(--mono);padding:6px 9px}
  .z-auftragzeile input:focus{outline:none;border-color:var(--hud)}
  #a-cwd{width:180px} #a-runden,#a-parallel{width:54px}
  #a-start{border-color:color-mix(in srgb,var(--hud) 45%,transparent);color:var(--hud);
    background:color-mix(in srgb,var(--hud) 12%,transparent)}
  .z-rollen{font:9.5px var(--mono);color:var(--overlay)}
  .z-auftragnote{font:10px var(--mono);color:var(--lauf);min-height:13px}
  .z-kopf{display:flex;align-items:center;gap:8px}
  #z-buehne{flex:1;min-height:0;position:relative}
  #z-buehne canvas{display:block;position:absolute;inset:0}
  /* Gefaelschtes Bloom: ein Farbverlauf hinter dem Canvas kostet nichts,
     ein Postprocessing-Pass kostet ein Drittel der Bildrate. */
  #z-buehne::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      color-mix(in srgb,var(--hud) 13%,transparent) 0%, transparent 62%)}
  .z-hinweis{font-size:11px;color:var(--wartet);min-height:0}
  .z-ringe{display:flex;gap:10px;justify-content:space-around;flex-wrap:wrap}
  .z-ring{text-align:center}
  .z-ringtitel{font:10px var(--mono);color:var(--subtext);margin-top:5px}
  .z-ringnote{font:9px var(--mono);color:var(--overlay)}
  .z-fuss{font:10px var(--mono);color:var(--overlay);margin-top:auto}
  #z-agentenliste,#z-stromliste{overflow-y:auto;min-height:0;display:flex;
    flex-direction:column;gap:6px}
  .z-agent{background:var(--base);border:1px solid var(--surface0);border-radius:7px;
    padding:6px 9px}
  .z-agentname{font:11.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .z-agentmeta{display:flex;gap:8px;font:9.5px var(--mono);color:var(--overlay);margin-top:2px}
  .z-strom-zeile{display:flex;gap:7px;font:10px/1.5 var(--mono);align-items:baseline}
  .z-strom-zeit{color:var(--overlay);flex:0 0 auto}
  .z-strom-art{flex:0 0 auto;min-width:74px}
  .z-strom-text{color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Sprachleiste: das Gegenstueck zu "TALK TO JARVIS", aber mit echtem Pegel. */
  .z-sprachblock{flex:0 0 auto}
  .z-sprachleiste{flex:0 0 auto;display:flex;align-items:center;gap:12px;
    margin:0 12px 12px;padding:9px 14px;background:var(--mantle);
    border:1px solid var(--hud-rand);border-radius:10px}
  .z-mikro{width:38px;height:38px;flex:0 0 auto;border-radius:50%;font-size:15px;
    background:var(--crust);border:1px solid var(--hud-rand);color:var(--overlay);cursor:pointer}
  .z-mikro.an{color:var(--hud);border-color:var(--hud);
    box-shadow:0 0 16px color-mix(in srgb,var(--hud) 45%,transparent)}
  /* 'arbeitet': Erkennung/Antwort/Sprechen laeuft -- ein Tipp waere jetzt
     wirkungslos, das soll man dem Knopf ansehen, bevor man ihn drueckt. */
  .z-mikro.arbeitet{opacity:.55;cursor:wait;color:var(--werkzeug);border-color:var(--werkzeug)}
  #z-welle{flex:1;min-width:0;height:44px}
  .z-sprachtext{flex:0 0 auto;min-width:112px}
  .z-sprachnote{font:10px var(--mono);color:var(--overlay);margin-top:2px;
    max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .z-sprachnote.fehler{color:var(--fehler)}
  .z-gespraech{max-height:132px;overflow-y:auto;display:none;flex-direction:column;
    gap:5px;margin:0 12px 12px;padding:2px 2px 0}
  .z-gespraech.an{display:flex}
  .z-gzeile{font:11px/1.4 var(--mono);padding:6px 9px;border-radius:7px;
    background:var(--mantle);border:1px solid var(--hud-rand)}
  .z-gzeile .wer{color:var(--overlay);margin-right:7px}
  .z-gzeile.du{color:var(--subtext)}
  .z-gzeile.cockpit{color:var(--hud)}

  @media (max-width:820px){
    .z-raster{grid-template-columns:1fr;
      grid-template-rows:auto auto auto auto auto auto;
      grid-template-areas:"kern" "auftrag" "limit" "last" "agenten" "strom";overflow-y:auto}
    #a-cwd{width:100%}
    #z-kern{min-height:46vh}
    .z-sprachtext{display:none}
    .z-sprachleiste{margin:0 8px 8px;gap:8px;padding:7px 10px;flex-wrap:wrap}
    .z-gespraech{margin:0 8px 8px;max-height:90px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Cockpit</h1>
    <span class="pill" id="verbindung">verbinde…</span>
    <span class="pill" id="budget">0 Tokens</span>
    <span class="pill" id="limit" title="Gemessene Auslastung der Nutzungsfenster">Fenster —</span>
    <div class="spacer"></div>
    <button class="still schubladenknopf" id="aufAgenten" title="Agenten">☰</button>
    <select id="laufwahl" title="Lauf"></select>
    <button class="still" id="neu">Neuer Lauf</button>
    <select id="stimmwahl" title="Sprachausgabe">
      <option value="aus">🔇 stumm</option>
      <option value="wichtig">🔔 Wichtiges</option>
      <option value="alles">🔊 alles</option>
    </select>
    <button class="still schubladenknopf" id="aufFreigaben" title="Freigaben">✓</button>
  </header>

  <nav id="tableiste"></nav>

  <aside>
    <h2>Agenten</h2>
    <div id="agenten"><div class="leer">noch keine</div></div>
  </aside>

  <main>
    <div id="graphbox">
      <div id="graphkopf">
        <h2 id="ansichttitel">Agentengraph</h2>
        <div class="spacer"></div>
        <div id="ansichtwahl">
          <button class="an" data-ansicht="graph">Graph</button>
          <button data-ansicht="zeit">Zeitachse</button>
        </div>
        <button id="graphklapp" title="Bereich ein- oder ausklappen">einklappen</button>
      </div>
      <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="zeitachse" class="weg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="filterhinweis">
      <span id="filtertext"></span>
      <button id="filterweg">alle zeigen</button>
    </div>
    <div id="log"></div>
    <div id="eingabe">
      <textarea id="prompt" placeholder="Auftrag an den Agenten… (Strg+Enter sendet)"></textarea>
      <button id="senden">Start</button>
    </div>
  </main>

  <div id="rechts">
    <h2>Freigaben</h2>
    <div id="freigaben"><div class="leer">keine offen</div></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
