<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Cockpit</title>
<link rel="stylesheet" href="./stil.css">
<link rel="stylesheet" href="./bereiche.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./symbol.svg" type="image/svg+xml">
<meta name="theme-color" content="#1e1e2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="app">
  <aside id="seite" aria-label="Navigation">
    <div class="seite-kopf">
      <a class="marke-logo" href="#/chat" aria-label="Cockpit – neuer Chat"><img src="./symbol.svg" alt="" width="20" height="20"><span>Cockpit</span></a>
      <button type="button" class="knopf-klein nur-handy" id="seiteZu" aria-label="Menü schließen"></button>
    </div>
    <a class="neu-chat" href="#/chat" id="neuerChat"></a>
    <nav class="bereiche" id="bereiche" aria-label="Bereiche"></nav>
    <div id="chatlisteOrt"></div>
    <div class="seite-fuss" id="seiteFuss"></div>
  </aside>
  <div id="schleier" aria-hidden="true"></div>
  <main id="haupt">
    <div class="handy-leiste">
      <button type="button" class="knopf-klein" id="seiteAuf" aria-label="Menü öffnen" aria-controls="seite" aria-expanded="false"></button>
      <span class="handy-titel" id="handyTitel">Cockpit</span>
      <a class="knopf-klein" href="#/chat" id="handyNeu" aria-label="Neuer Chat"></a>
    </div>
    <div id="flaechen"></div>
  </main>
</div>
<noscript>Das Cockpit braucht JavaScript.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
