[package]
name = "cockpit"
version = "0.1.0"
description = "Zentrale fuer Claude-Code-Agenten"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nur fuer die Mikrofon-Freigabe (sprachpegel.js) und die WebGL-Einstellungen
# (three.js im Vault-Tab) -- Zugriff auf die rohe WebKitGTK-Webview ueber
# Tauris with_webview(). "v2_16" fuer die Hardwarebeschleunigungs-Policy;
# das System-WebKitGTK ist deutlich neuer (siehe README).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_16"] }
glib = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
